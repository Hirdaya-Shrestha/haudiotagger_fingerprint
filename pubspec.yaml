name: haudiotagger_fingerprint
description: Perceptual audio fingerprinting for Flutter. Identify and compare recordings by content — duplicate detection, library cleanup, song matching. Powered by Rust. Sibling of haudiotagger.
version: 0.1.0
homepage: https://github.com/Hirdaya-Shrestha/haudiotagger_fingerprint
repository: https://github.com/Hirdaya-Shrestha/haudiotagger_fingerprint

topics:
  - audio
  - fingerprint
  - duplicate-detection
  - audio-identification

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  ffi: ^2.2.0
  flutter_rust_bridge: ^2.13.0
  freezed_annotation: ^3.1.0
  rust_lib_haudiotagger_fingerprint:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Joint-composition proof only: never installed by consumers, so this
  # package stays fully standalone. Used by test/addon_test.dart.
  haudiotagger: ^2.1.0
  flutter_lints: ^6.0.0
  ffigen: ^21.0.0
  freezed: ^4.0.0
  build_runner: ^2.4.6
  analyzer: ^13.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ha.nep.haudiotagger_fingerprint
        pluginClass: HaudioFingerprintPlugin
      ios:
        pluginClass: HaudioFingerprintPlugin
      linux:
        pluginClass: HaudioFingerprintPlugin
      macos:
        pluginClass: HaudioFingerprintPlugin
      windows:
        pluginClass: HaudioFingerprintPluginCApi
      web:
        pluginClass: HaudioFingerprintWeb
        fileName: haudiotagger_fingerprint_web.dart
  assets:
    - pkg/haudiotagger_fingerprint_bg.wasm
    - pkg/haudiotagger_fingerprint.js
